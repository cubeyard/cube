[package]
name = "cube-gateway"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "cube_gateway"

[[bin]]
name = "cube-gateway"
path = "src/main.rs"

[features]
# Adds `--test-upstream HOST=ADDR` and `--test-upstream-ca FILE` so tests can
# map hosts to local fake upstreams. Never enabled in release builds.
test-hooks = []

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
cube-runner = { path = "../node-transport" }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
heapless = "0.9"
libc = "0.2"
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-tcp-cubic", "socket-udp", "proto-dhcpv4"] }
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time", "net", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = "0.7"

[dev-dependencies]
cube-gateway = { path = ".", features = ["test-hooks"] }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-tcp-cubic", "socket-udp", "socket-dhcpv4", "proto-dhcpv4", "async"] }
tempfile = "3"
