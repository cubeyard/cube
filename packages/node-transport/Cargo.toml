[package]
name = "cube-node-transport"
version = "0.1.1"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
libc = "0.2"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.11"
rustix = { version = "1", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "signal", "process"] }

[dev-dependencies]
tempfile = "3"
