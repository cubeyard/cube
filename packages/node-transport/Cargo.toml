[package]
name = "cube-runner"
version = "0.8.4"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "cube_node_transport"

[[bin]]
name = "cube-runner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
# Writes the cloud-init NoCloud seed (a FAT `CIDATA` image) without
# genisoimage or hdiutil on the runner host.
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
libc = "0.2"
# Verifies signed runner releases for self-update (already in the tree via iroh).
ed25519-dalek = { version = "3", default-features = false, features = ["alloc"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.11"
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "signal", "process", "net", "sync"] }
# Runner protocol 4 (proto/runner.proto): prost types with proto3-JSON serde.
prost = "0.14"
pbjson = "0.9"
pbjson-types = "0.9"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[build-dependencies]
prost = "0.14"
# Compiles proto/runner.proto without a system protoc.
protox = "0.10"
prost-build = "0.14"
pbjson-build = "0.9"

[dev-dependencies]
prost-types = "0.14"
tempfile = "3"
