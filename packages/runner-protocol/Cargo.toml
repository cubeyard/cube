[package]
name = "cube-runner-protocol"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Runner protocol 4 (cubeyard/runner/4): the types of proto/runner.proto and its stream framing"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
pbjson = "0.9"
pbjson-types = "0.9"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util"] }

[build-dependencies]
pbjson-build = "0.9"
prost = "0.14"
prost-build = "0.14"
# Compiles proto/runner.proto without a system protoc.
protox = "0.10"

[dev-dependencies]
prost-types = "0.14"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
