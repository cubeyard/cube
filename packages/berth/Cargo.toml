[package]
name = "berth"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "cube's runner on runner protocol 4; today only `berth host` (unsandboxed, for developing runners)"

[[bin]]
name = "berth"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cube-runner-protocol = { path = "../runner-protocol" }
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "signal", "process", "net", "sync"] }
