[package]
name = "berth"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "cube's runner on runner protocol 4: `berth vm` (keel guests under QEMU) and `berth host` (unsandboxed, for developing runners)"

[[bin]]
name = "berth"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
cube-netstack = { path = "../netstack", features = ["loaded-ca"] }
cube-runner-protocol = { path = "../runner-protocol" }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
keel-layers = { path = "../keel/layers" }
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
libc = "0.2"
pbjson-types = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "signal", "process", "net", "sync"] }

[dev-dependencies]
base64 = "0.22"
# Local fake upstreams for the egress tests; never in release builds.
cube-netstack = { path = "../netstack", features = ["loaded-ca", "test-hooks"] }
flate2 = "1"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-tcp-cubic", "socket-udp", "async"] }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
