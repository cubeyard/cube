[package]
name = "cube-agent"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "keel's guest agent: protocol 4's DaemonFrame on the virtio-serial port cube.0, machine_setup and the OPERATIONS journal"

[dependencies]
anyhow = "1"
base64 = "0.22"
cube-runner-protocol = { path = "../../runner-protocol" }
libc = "0.2"
memchr = "2"
serde_json = "1"
sha1_smol = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[dev-dependencies]
# A real runner CA for the template tests, made as berth makes one (berth/src/vm/ca.rs).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3"
