[package]
name = "cube-agent"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "keel's guest agent: protocol 4's DaemonFrame on the virtio-serial port cube.0, machine_setup and the OPERATIONS journal"

[dependencies]
anyhow = "1"
cube-runner-protocol = { path = "../../runner-protocol" }
libc = "0.2"
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
