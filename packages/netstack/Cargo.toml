[package]
name = "cube-netstack"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "cube_netstack"

[features]
# Lets `Upstream` map hosts to local fake upstreams without the public
# address check, for tests. Never enabled in release builds.
test-hooks = []
# `Ca::from_loaded`: a CA kept and loaded by its owner (berth), whose issuer
# is read from its certificate (rcgen's X.509 parser). The gateway does not
# need it.
loaded-ca = ["rcgen/x509-parser"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
http = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
sha2 = "0.11"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-tcp-cubic", "socket-udp", "proto-dhcpv4"] }
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "net", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
