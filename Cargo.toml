[workspace]
members = ["packages/gateway", "packages/netstack", "packages/runner-protocol", "packages/berth", "packages/keel/layers", "packages/keel/agent", "packages/keel/agent-check"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"

[profile.dev]
debug = 1

# berth and keel-layers hash images and layers (hundreds of MB); an
# unoptimized sha2 makes development builds take tens of seconds for that.
[profile.dev.package.sha2]
opt-level = 3
