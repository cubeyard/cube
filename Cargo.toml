[workspace]
members = ["packages/node-transport", "packages/gateway", "packages/runner-protocol", "packages/berth", "packages/keel/layers"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"

[profile.dev]
debug = 1

# The runner hashes the base VM image (hundreds of MB) at every start; an
# unoptimized sha2 makes development builds take tens of seconds for that.
[profile.dev.package.sha2]
opt-level = 3
