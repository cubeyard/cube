[package]
name = "l2-gateway-spike"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

# Not part of the product workspace: a spike for raw L2 frames over Iroh.
[workspace]

[dependencies]
anyhow = "1"
bytes = "1"
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
smoltcp = { version = "0.14", default-features = false, features = ["std", "log", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-icmp", "proto-dhcpv4"] }
heapless = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "net", "sync"] }
