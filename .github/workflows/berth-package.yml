# berth's release bundles, by hand only, for a proof before a release: the
# same build as release.yml's berth-build (.github/actions/berth-build), with
# the label dev-<commit>. No secret, no signing, no release.
name: berth package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  berth-build:
    name: berth ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            os: ubuntu-latest
          - platform: darwin-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: label
        id: label
        run: echo "label=dev-${GITHUB_SHA:0:12}" >>"$GITHUB_OUTPUT"
      - uses: ./.github/actions/berth-build
        with:
          platform: ${{ matrix.platform }}
          label: ${{ steps.label.outputs.label }}
