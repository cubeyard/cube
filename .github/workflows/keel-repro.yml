# keel builds the same bytes twice: each architecture is built in two
# separate jobs on fresh runners of that architecture, and every output
# (kernel, config, base, the boot check's base, the file listing, the cache
# keys) must be identical. Any difference fails the run: no reproducible
# build, no release. The release builds and compares the same way
# (release.yml).
name: keel reproducible

on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/keel/kernel/**
      - packages/keel/base/**
      # base.erofs carries cube-init and cube-agent, built from these.
      - packages/keel/init/**
      - packages/keel/agent/**
      - packages/keel/apt-snapshot.sh
      - .github/workflows/keel-repro.yml
      - .github/actions/keel-build/**
      - scripts/keel/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: keel ${{ matrix.arch }} build ${{ matrix.build }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        build: [a, b]
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/keel-build
        with:
          arch: ${{ matrix.arch }}
          build: ${{ matrix.build }}

  compare:
    name: keel ${{ matrix.arch }} same twice
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: keel-${{ matrix.arch }}-*
          path: builds
      - name: both builds are byte for byte the same
        run: bash scripts/keel/compare-builds.sh "builds/keel-${{ matrix.arch }}-a" "builds/keel-${{ matrix.arch }}-b" | tee -a "$GITHUB_STEP_SUMMARY"
