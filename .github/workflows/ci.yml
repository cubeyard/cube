# The fast gate on Linux: typecheck, lint, the offline suites in parallel
# shards, the browser tests and the Rust checks. macOS and Homebrew run in
# platforms.yml; release.yml requires both on the tagged commit.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run; main runs every commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/node-deps
      - run: pnpm check:references
      - run: pnpm proto:check
      - run: pnpm typecheck
      - run: pnpm lint
      - name: shell syntax
        run: |
          set -e
          for f in scripts/*.sh scripts/cubed/*.sh scripts/keel/*.sh scripts/berth/*.sh; do
            bash -n "$f"
          done
      - name: shellcheck scripts/*.sh
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: ./scripts
          severity: warning
      - name: keel C sources (cube-init and the boot check's agent stand-in)
        run: |
          set -e
          for f in packages/keel/init/*.c; do
            gcc -static -O2 -D_FORTIFY_SOURCE=2 -Wall -Wextra -Werror -o /dev/null "$f"
          done

  test:
    name: test (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/node-deps
      - run: bash scripts/test-offline.sh
        env:
          CUBE_TEST_SHARD: ${{ matrix.shard }}/4
          CUBE_TEST_GUEST_ROOT: required

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/node-deps
      - run: pnpm test:browser
        env:
          CUBE_SCREENSHOTS: ${{ runner.temp }}/screenshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 7

  node-transport:
    name: node-transport (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/node-deps
      - uses: ./.github/actions/rust-deps
      - name: erofs-utils and qemu-img for keel-layers
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends erofs-utils qemu-utils
      - name: cube-agent, static musl as base.erofs builds it (both architectures)
        run: |
          set -e
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            RUSTFLAGS="-C linker=rust-lld -C target-feature=+crt-static" \
              cargo build --locked --offline --release -p cube-agent --target "$target"
            file "target/$target/release/cube-agent" | tee /dev/stderr | grep -q 'statically linked\|static-pie linked'
          done
      - name: Ubuntu's QEMU, below keel's floor, for berth vm to refuse
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86
          qemu-system-x86_64 --version | head -1
          if qemu-system-x86_64 --version | grep -q 'version 8\.2\.'; then
            echo "CUBE_TEST_BERTH_OLD_QEMU=$(command -v qemu-system-x86_64)" >>"$GITHUB_ENV"
          fi
      - name: real-QUIC Rust and in-process Node interoperability
        run: bash scripts/test-node-transport.sh
        env:
          CUBE_TEST_LAYER_TOOLS: required
          # The runner image's JDK and openssl: keel's keystore repair against
          # the real keytool, its -CApath hash against openssl's.
          CUBE_TEST_KEYTOOL: required
          CUBE_TEST_OPENSSL: required
      # Last: root's build output stays in its own target directory.
      - name: cube-agent's root-only tests, as root
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" CUBE_AGENT_ROOT_TESTS=1 \
            cargo test --locked --offline -p cube-agent --lib --target-dir target/as-root -- \
            out_of_the_workspace_the_agent_account_acts hooks_are_read_as_the_caller \
            whiteouts_and_opaque_directories_hide_lower_files \
            run_enters_the_workload_namespace_at_its_root \
            an_escaped_process_is_killed_with_the_call_s_cgroup
