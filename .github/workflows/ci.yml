# Product checks and actual runner integration on Linux and macOS.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-transport:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - name: pinned Node dependencies
        run: |
          npm i -g "pnpm@$(sed -n 's/.*"packageManager": *"pnpm@\([^"]*\)".*/\1/p' package.json)"
          pnpm install --frozen-lockfile
      - name: pinned Rust toolchain
        run: |
          version=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$version"
          rustup set auto-self-update disable
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
      - name: locked dependencies
        run: cargo fetch --locked
      - name: real-QUIC Rust and in-process Node interoperability
        run: bash scripts/test-node-transport.sh

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - name: pnpm (the version package.json pins)
        run: |
          npm i -g "pnpm@$(sed -n 's/.*"packageManager": *"pnpm@\([^"]*\)".*/\1/p' package.json)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: shell syntax
        run: |
          set -e
          for f in scripts/*.sh scripts/cubed/*.sh scripts/runner/*.sh; do
            bash -n "$f"
          done
      - name: shellcheck scripts/*.sh
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: ./scripts
          severity: warning

  # The Homebrew formulas this checkout generates, installed from the latest
  # published release on a real Mac: install, audit, formula tests, the
  # launchers. No thread machine: GitHub's macOS runners have no nested
  # virtualization, so the runner service and HVF are not exercised here.
  homebrew:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - name: generate the formulas from the latest release's signed manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/assets" "$RUNNER_TEMP/formula"
          gh release download "$version" --repo "$GITHUB_REPOSITORY" --pattern 'cubed-darwin-arm64.json*' --pattern 'cube-runner-darwin-arm64.json*' --dir "$RUNNER_TEMP/assets"
          node scripts/homebrew/formula.ts "$version" --assets "$RUNNER_TEMP/assets" --out "$RUNNER_TEMP/formula"
      - name: install, audit and test
        run: |
          set -euo pipefail
          brew tap-new --no-git cubeyard/tap
          cp "$RUNNER_TEMP"/formula/*.rb "$(brew --repository cubeyard/tap)/Formula/"
          brew trust cubeyard/tap
          brew install cubeyard/tap/cube
          brew audit --strict cubeyard/tap/cube cubeyard/tap/cube-runner
          brew test cubeyard/tap/cube cubeyard/tap/cube-runner
          cubed --version
          cubed --help | grep -q 'runners status'
          cube-runner version | grep -q '"protocolVersion":3'
          sysctl -n kern.hv_support || true
          brew services list
