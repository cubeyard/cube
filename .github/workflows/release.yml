# Build signed cubed, keel and berth release assets. Publishing the draft
# remains an explicit maintainer action. No cube-runner (protocol 3) is
# built: a protocol-3 runner's hourly updater finds none and keeps its
# version (docs/runner-operations.md).
name: cubed release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  # Fast pull-request CI leaves macOS to main (platforms.yml): release only a
  # commit whose checks on main passed.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: the tagged commit passed ci and node-transport (macos) on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: bash scripts/release-gate.sh

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64-gnu
          - os: ubuntu-24.04-arm
            target: linux-arm64-gnu
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - name: pinned dependencies
        run: |
          npm i -g "pnpm@$(sed -n 's/.*"packageManager": *"pnpm@\([^"]*\)".*/\1/p' package.json)"
          pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: build and sign cubed package
        env:
          SIGNING_KEY: ${{ secrets.CUBED_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          umask 077
          key="$RUNNER_TEMP/cubed-update-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          node scripts/cubed/verify-signing-key.ts \
            "$key" \
            scripts/cubed/update-public-key.pem \
            scripts/cubed/update-public-key.fingerprint
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          node scripts/cubed/build-release.ts "$GITHUB_REF_NAME" dist "$base" "$key"
          test -f "dist/cubed-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          test -f "dist/cubed-${{ matrix.target }}.json.sig"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cubed-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # keel: each architecture built twice on its own architecture (as
  # keel-repro.yml does); the release stops unless both builds are byte for
  # byte the same. Builds never see the signing key.
  keel-build:
    name: keel ${{ matrix.arch }} build ${{ matrix.build }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        build: [a, b]
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/keel-build
        with:
          arch: ${{ matrix.arch }}
          build: ${{ matrix.build }}

  keel:
    name: keel ${{ matrix.arch }} release assets
    needs: keel-build
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: keel-${{ matrix.arch }}-*
          path: builds
      - name: both builds are byte for byte the same
        run: bash scripts/keel/compare-builds.sh "builds/keel-${{ matrix.arch }}-a" "builds/keel-${{ matrix.arch }}-b" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: sign the keel manifest
        env:
          SIGNING_KEY: ${{ secrets.CUBED_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          umask 077
          key="$RUNNER_TEMP/cubed-update-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          node scripts/cubed/verify-signing-key.ts \
            "$key" \
            scripts/cubed/update-public-key.pem \
            scripts/cubed/update-public-key.fingerprint
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          node scripts/keel/build-release.ts "$GITHUB_REF_NAME" "${{ matrix.arch }}" "builds/keel-${{ matrix.arch }}-a" dist "$base" "$key"
          test -f "dist/keel-${{ matrix.arch }}.json.sig"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cubed-keel-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # berth: built per platform without the key, then signed in a later job.
  berth-build:
    name: berth ${{ matrix.platform }} build
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            os: ubuntu-latest
          - platform: darwin-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/berth-build
        with:
          platform: ${{ matrix.platform }}
          label: ${{ github.ref_name }}

  berth:
    name: berth ${{ matrix.platform }} release assets
    needs: berth-build
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64-gnu, darwin-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: berth-${{ matrix.platform }}
          path: package
      - name: sign the berth manifest
        env:
          SIGNING_KEY: ${{ secrets.CUBED_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          umask 077
          key="$RUNNER_TEMP/cubed-update-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          node scripts/cubed/verify-signing-key.ts \
            "$key" \
            scripts/cubed/update-public-key.pem \
            scripts/cubed/update-public-key.fingerprint
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          node scripts/berth/build-release.ts "$GITHUB_REF_NAME" "${{ matrix.platform }}" package dist "$base" "$key"
          test -f "dist/berth-${{ matrix.platform }}.json.sig"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cubed-berth-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  draft:
    needs: [build, keel, berth]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # The release assets only, not the raw builds (keel-*, berth-*).
          pattern: cubed-*
          path: dist
          merge-multiple: true
      - name: add trust bootstrap and installer assets
        run: |
          set -euo pipefail
          cp \
            scripts/cubed/install.sh \
            scripts/cubed/service.sh \
            scripts/cubed/update-public-key.pem \
            scripts/cubed/update-public-key.fingerprint \
            dist/
          chmod 0755 dist/install.sh dist/service.sh
          bash scripts/cubed/write-checksums.sh dist
          (cd dist && sha256sum -c SHA256SUMS)
      - name: create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME"
          fi
