# One berth build for one platform: the pinned Rust toolchain only, `cargo
# build --release --locked -p berth`, the bundle by scripts/berth/package.sh,
# with version.json and provenance.txt, uploaded as the artifact
# berth-<platform>. No signing key: release.yml signs in a later job. No
# build cache either: a signed release binary is compiled from source, never
# from objects restored out of the Actions cache (so not the shared Rust
# dependencies action, which adds sccache and a target cache).
name: berth build
description: build berth and pack its release bundle for one platform
inputs:
  platform:
    description: linux-x64-gnu or darwin-arm64, the runner's own platform
    required: true
  label:
    description: the bundle's label (the release tag, or dev-<commit> for a dispatch)
    required: true
runs:
  using: composite
  steps:
    - name: pinned Rust toolchain
      shell: bash
      run: |
        version=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
        test -n "$version"
        rustup set auto-self-update disable
        rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
    - name: berth
      shell: bash
      run: cargo build --release --locked -p berth
    - name: bundle
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        LABEL: ${{ inputs.label }}
      run: |
        set -euo pipefail
        bash scripts/berth/package.sh "$LABEL" "$PLATFORM" "$RUNNER_TEMP/berth-$PLATFORM"
        (cd "$RUNNER_TEMP/berth-$PLATFORM" && cat version.json provenance.txt) | tee -a "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: berth-${{ inputs.platform }}
        path: ${{ runner.temp }}/berth-${{ inputs.platform }}/
        if-no-files-found: error
