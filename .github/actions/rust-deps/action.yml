# The pinned Rust toolchain, the dependency build cache and the locked crates.
# Only main saves the Swatinem target-directory cache; pull requests restore
# main's. sccache wraps rustc and reuses per-crate compilation output through
# the GitHub Actions cache: Swatinem skips unchanged crates (fingerprints
# match, rustc is not called), sccache rebuilds changed ones from a prior
# hit instead of from scratch. GHA cache is the only backend; no S3, no R2.
name: rust dependencies
description: pinned Rust toolchain, cached dependency builds, cargo fetch --locked
runs:
  using: composite
  steps:
    - name: pinned Rust toolchain
      shell: bash
      run: |
        version=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
        test -n "$version"
        rustup set auto-self-update disable
        rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
    - name: enable sccache as rustc wrapper
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >>"$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >>"$GITHUB_ENV"
        # sccache cannot cache cargo's incremental artifacts; disable them in CI.
        echo "CARGO_INCREMENTAL=0" >>"$GITHUB_ENV"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: locked dependencies
      shell: bash
      run: cargo fetch --locked
