packages:
  - packages/*
  # Its own workspace and lockfile: Astro in the root workspace re-resolves
  # cubed's dependencies (it gave the server's Pi packages a zod peer).
  - '!packages/docs'
allowBuilds:
  '@bufbuild/buf': false
  '@google/genai': false
  esbuild: true
  protobufjs: false
minimumReleaseAgeExclude:
  - '@earendil-works/chord@0.85.1'
  - '@earendil-works/pi-agent-core@0.85.1'
  - '@earendil-works/pi-ai@0.85.1'
  - '@earendil-works/pi-coding-agent@0.85.1'
  - '@earendil-works/pi-telemetry@0.85.1'
  - '@earendil-works/pi-tui@0.85.1'
