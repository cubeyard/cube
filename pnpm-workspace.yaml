packages:
  - packages/*
  # Its own workspace and lockfile: the docs site's toolchain never enters
  # cubed's dependency graph or the code CI's install.
  - '!packages/docs'
allowBuilds:
  '@bufbuild/buf': false
  '@google/genai': false
  esbuild: true
  protobufjs: false
minimumReleaseAgeExclude:
  - '@earendil-works/chord@0.85.1'
  - '@earendil-works/pi-agent-core@0.85.1'
  - '@earendil-works/pi-ai@0.85.1'
  - '@earendil-works/pi-coding-agent@0.85.1'
  - '@earendil-works/pi-telemetry@0.85.1'
  - '@earendil-works/pi-tui@0.85.1'
