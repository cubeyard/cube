packages:
  - packages/*
# Code mode uses Monty's WASM export in our disposable Node worker, never
# its N-API addon or subprocess binary (including in cross-platform app builds).
ignoredOptionalDependencies:
  - '@pydantic/monty-darwin-x64'
  - '@pydantic/monty-darwin-arm64'
  - '@pydantic/monty-linux-x64-gnu'
  - '@pydantic/monty-linux-arm64-gnu'
  - '@pydantic/monty-win32-x64-msvc'
allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
minimumReleaseAgeExclude:
  - '@earendil-works/chord@0.85.1'
  - '@earendil-works/pi-agent-core@0.85.1'
  - '@earendil-works/pi-ai@0.85.1'
  - '@earendil-works/pi-coding-agent@0.85.1'
  - '@earendil-works/pi-telemetry@0.85.1'
  - '@earendil-works/pi-tui@0.85.1'
